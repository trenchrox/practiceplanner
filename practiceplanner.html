button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh}
header.top{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font:700 25px 'Big Shoulders','Instrument Sans',sans-serif,serif;letter-spacing:.2px;margin-right:6px;white-space:nowrap}
.brand small{display:block;font:700 11px 'Instrument Sans',sans-serif;color:var(--muted)}
.top select{background:var(--card);border:1px solid var(--line);padding:7px 10px;min-width:220px}
.btn{background:var(--card);border:1px solid var(--line);padding:7px 12px;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.danger{border-color:var(--red);color:var(--red)}
.spacer{flex:1}
.main{display:grid;grid-template-columns:320px 1fr;min-height:0;min-width:0}
nav.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto}
nav.side .brand{margin:0 0 14px}
.navlbl{font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 2px}
nav.side select{width:100%;background:var(--card);border:1px solid var(--line);padding:7px 8px}
.nav{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-left:3px solid transparent;padding:8px 10px}
.nav:hover{background:var(--card);border-left-color:var(--muted)}
nav.side .navspacer{flex:1 1 auto;min-height:8px}
a.nav{text-decoration:none;color:inherit;box-sizing:border-box}
.nav.primary{background:var(--accent);color:var(--on-accent);font-weight:700;margin-top:8px}
.nav.primary:hover{filter:brightness(1.1);border-left-color:transparent}
.navfoot{margin-top:auto;font-size:11.5px;color:var(--muted);padding-top:16px}
.nav.view[aria-current="page"]{background:var(--card2);border-left-color:var(--accent);font-weight:700}
.over{overflow:auto;padding:26px 32px 60px}
.over h1{font:700 36px 'Big Shoulders','Instrument Sans',sans-serif;margin:0}
.over .lead{color:var(--muted);margin:4px 0 22px;max-width:70ch}
.ohead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ohead select{background:var(--card);border:1px solid var(--line);padding:7px 10px}
.stats{display:flex;gap:12px;margin:18px 0 26px;flex-wrap:wrap}
.stat{background:var(--card);padding:12px 16px;min-width:150px;border-top:3px solid var(--c,var(--line))}
.stat b{display:block;font:700 34px 'Big Shoulders','Instrument Sans',sans-serif}
.stat span{color:var(--muted);font-size:12.5px}
.week{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.week .wk{font-weight:700}.week .wk small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.week.now .wk{color:var(--accent)}
.days{display:flex;gap:12px;flex-wrap:wrap}
.days.cols{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:12px;align-items:stretch}
.days.cols .day{grid-column:var(--col);min-width:0;width:100%}
.day{background:var(--card);border-left:4px solid var(--st);padding:10px 14px;min-width:200px;min-height:64px;text-align:left;border-top:0;border-right:0;border-bottom:0}
.day:hover{background:var(--card2)}
.day .d1{font-weight:700}.day .d2{font-size:12px;color:var(--muted);margin-top:2px}.day .d3{font-size:12px;color:var(--muted)}
.day.past{opacity:.55}
.day.big{min-width:260px;padding:14px 16px}.day.big .d1{font:700 22px 'Big Shoulders','Instrument Sans',sans-serif}
.next{margin-bottom:6px}
.setup{max-width:820px}
.setup .form label{margin-top:12px}
.dayrow{display:grid;grid-template-columns:1.1fr 1.2fr .8fr .8fr auto;gap:8px;align-items:end;background:var(--card);padding:10px 12px;margin-top:8px}
.dayrow .opts{grid-column:1/-1;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.dayrow .opts input[type=text]{width:260px}
.brk{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;align-items:end;margin-top:6px}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
/* bank */
aside.bank{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.bank-head{padding:12px 14px;border-bottom:1px solid var(--line)}
.bank-head h2{font:700 21px 'Big Shoulders','Instrument Sans',sans-serif;margin:0 0 8px}
.bank-head input{width:100%;background:var(--card);border:1px solid var(--line);padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.chip{border:1px solid var(--line);background:transparent;padding:3px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{color:#000;background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.bank-list{overflow:auto;padding:10px 12px 40px;flex:1}
.bank-sec{font:700 12px 'Instrument Sans',sans-serif;color:var(--muted);margin:14px 2px 6px}
.ex{display:grid;grid-template-columns:4px 1fr;background:var(--card);margin-bottom:6px;cursor:grab;user-select:none}
.ex:hover{background:var(--card2)}
.ex .stripe{background:var(--c)}
.ex .body{padding:7px 10px}
.ex .code{font-weight:700;color:var(--c);font-size:12px;margin-right:6px}
.ex .name{font-weight:600}
.ex .meta{font-size:12px;color:var(--muted)}
/* plan */
section.plan{display:flex;flex-direction:column;min-width:0;min-height:0}
.plan-head{display:flex;align-items:baseline;gap:16px;padding:14px 20px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.plan-head h1{font:700 31px 'Big Shoulders','Instrument Sans',sans-serif;margin:0}
.plan-head .sub{color:var(--muted)}
.hint{color:var(--muted);font-size:12.5px}
.scroll{overflow:auto;flex:1;padding:14px 20px 60px}
.grid{display:grid;position:relative}
.ruler{position:relative;width:46px}
.ruler .tick{position:absolute;right:8px;font-size:11px;color:var(--muted);transform:translateY(-7px)}
.track{position:relative;border-left:1px solid var(--line);min-width:220px}
.track-h{position:sticky;top:0;z-index:5;background:var(--bg);border-left:1px solid var(--line);padding:6px 10px 8px;min-width:220px}
.track-h .t{font-weight:700}
.track-h .court{font-size:11px;font-weight:700;background:var(--card2);padding:1px 6px;margin-left:6px}
.track-h .used{font-size:12px;color:var(--muted)}
.track-h .used.over{color:var(--red);font-weight:700}
.track-h select{width:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);padding:3px 6px;font-size:12px}
.lines{position:absolute;inset:0;pointer-events:none;background-image:
  linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:100% calc(var(--ppm)*10),100% calc(var(--ppm)*5)}
.track.over{background:rgba(30,214,189,.07)}
.end{position:absolute;left:0;right:0;border-top:2px dashed var(--muted);pointer-events:none}
.blk{position:absolute;left:4px;right:4px;background:var(--card2);border-left:4px solid var(--c);padding:4px 8px;overflow:hidden;cursor:grab;user-select:none;touch-action:none}
.blk.all{background:#3a3a3c}
.blk.krock{outline:2px solid var(--red)}
.blk .l1{font-size:11.5px;color:var(--muted);font-weight:600}
.blk .l2{font-weight:700;line-height:1.25}
.blk .l2 .code{color:var(--c);margin-right:5px}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;background:linear-gradient(transparent 3px,var(--c) 3px,var(--c) 5px,transparent 5px)}
.allbar{position:absolute;z-index:3}
.empty{border:1px dashed var(--line);color:var(--muted);padding:30px;text-align:center;max-width:560px;margin:40px auto}
/* ---------- Ljust tema ---------- */
html:has(body.light){background:#f2f2f7;color-scheme:light}
body.light{--bg:#f2f2f7;--panel:#fafafc;--card:#ffffff;--card2:#e8e8ed;--line:rgba(0,0,0,.12);--text:#1c1c1e;--muted:#6b6b72;
  --yellow:#b8860b;--blue:#0a6fdc;--green:#248a3d;--purple:#8e3fc2;--red:#d70015;--accent:#0a8f7f;--on-accent:#fff;color-scheme:light}
body.light .ex,body.light .day,body.light .stat,body.light .dayrow{box-shadow:0 0 0 1px var(--line)}
body.light .ex .code,body.light .blk .l2 .code{color:color-mix(in srgb,var(--c) 62%,#000)}
body.light .blk.all{background:#dcdce1}
body.light .lines{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px)}
body.light .chip[aria-pressed="true"]{color:#fff}
body.light dialog::backdrop{background:rgba(0,0,0,.35)}
/* dialogs */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:0;max-width:640px;width:92vw}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlg-h{display:flex;align-items:flex-start;gap:12px;padding:16px 20px 10px;border-bottom:1px solid var(--line)}
.dlg-h h3{font:700 27px 'Big Shoulders','Instrument Sans',sans-serif;margin:0}
.dlg-b{padding:14px 20px;max-height:62vh;overflow:auto}
.dlg-f{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.lbl{font-weight:700;color:var(--muted);font-size:12px;margin:12px 0 4px}
.dlg-b ol,.dlg-b ul{margin:0;padding-left:20px}
.dlg-b li{margin:3px 0}
.form label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.form input,.form select,.form textarea{width:100%;background:var(--card);border:1px solid var(--line);padding:7px 9px}
.form textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
.check{display:flex;gap:8px;align-items:center;margin-top:10px}
.check input{width:auto}
.durctl{display:flex;align-items:center;gap:6px;margin-top:6px}
.durctl button{width:34px;height:30px;background:var(--card);border:1px solid var(--line)}
.durctl b{min-width:70px;text-align:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-weight:700;padding:8px 14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
#print{display:none}
@media print{
  body{background:#fff;color:#000}
  .app{display:none}
  #print{display:block;font:11pt 'Instrument Sans',sans-serif}
  #print h1{font:700 22pt 'Big Shoulders','Instrument Sans',sans-serif;margin:0 0 4pt}
  #print h2{font:700 16pt 'Big Shoulders','Instrument Sans',sans-serif;margin:14pt 0 4pt;border-bottom:1px solid #999}
  #print .pb{page-break-inside:avoid;margin:6pt 0}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
/* ---------- Stående iPad och smala fönster ---------- */
#moreBtn,.plan-bar,.bank-close,.bank-back,.addb{display:none}
@media (max-width:980px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav.side{flex-direction:row;flex-wrap:wrap;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-left));border-right:0;border-bottom:1px solid var(--line);overflow:visible}
  nav.side .brand{margin:0 10px 0 0}
  nav.side .nav{width:auto}
  nav.side .nav.primary{margin-top:0}
  nav.side select{width:auto;flex:1 1 160px;max-width:280px}
  nav.side .navlbl,nav.side .navfoot,nav.side .navspacer{display:none}
  nav.side .more{display:none}
  nav.side.more-open .more{display:block}
  nav.side.more-open .navfoot{display:block;flex-basis:100%;padding-top:0;margin-top:0}
  #moreBtn{display:block;margin-left:auto}
  .main{grid-template-columns:1fr}
  .over{padding:20px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
  aside.bank{position:fixed;left:0;top:0;bottom:0;width:min(440px,90vw);z-index:30;border-right:1px solid var(--line);
    transform:translateX(-102%);transition:transform .2s;padding-top:env(safe-area-inset-top)}
  .main.bank-open aside.bank{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  .bank-back{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.5);border:0;padding:0}
  .main.bank-open .bank-back{display:block}
  .bank-close{display:block;position:absolute;right:10px;top:10px;background:var(--card);border:1px solid var(--line);width:40px;height:40px;font-size:18px}
  .plan-bar{display:block;padding:10px 16px 0}
  #bankToggle{min-height:44px;padding:8px 16px}
  .plan-head{padding:12px 16px 8px}
  .scroll{padding:10px 12px 60px}
}
@media (max-width:980px),(hover:none){
  .addb{display:block;background:var(--accent);color:var(--on-accent);border:0;width:44px;font:700 22px/1 'Instrument Sans',sans-serif}
  .ex{grid-template-columns:4px 1fr auto}
  .ex .body{padding:10px 12px}
}
@media (max-width:640px){.week{grid-template-columns:1fr}.days.cols{grid-template-columns:1fr}.days.cols .day{grid-column:auto}}
@media (prefers-reduced-motion:reduce){aside.bank{transition:none}}

function renderChips(){
  $("#chips").innerHTML = CHIPS.map(([n,g],i) => {
    const c = g ? color(g[0]) : "var(--accent)";
    const on = (filter === null && !g) || (filter && g && filter.join() === g.join());

function renderBank(){

/* ---------- plan ---------- */
function blocksFor(s, trackId){ return s.blocks.filter(b => b.trackId === trackId || b.trackId === "all").sort((a,b) => a.startMin - b.startMin); }
function freeStart(s, trackId){ const bl = blocksFor(s, trackId); return bl.length ? Math.max(...bl.map(b => b.startMin + b.durMin)) : 0; }
function usedMin(s, trackId){
  const iv = blocksFor(s, trackId).map(b => [b.startMin, b.startMin + b.durMin]).sort((a,b) => a[0]-b[0]);
  let tot = 0, cur = null;
  for(const [a,b] of iv){ if(!cur || a > cur[1]){ if(cur) tot += cur[1]-cur[0]; cur = [a,b]; } else cur[1] = Math.max(cur[1], b); }
  if(cur) tot += cur[1]-cur[0];
  return tot;
}
function numberMap(s){
  const map = {};
  for(const t of s.tracks){ blocksFor(s, t.id).forEach((b,i) => { if(!(b.id in map)) map[b.id] = i + 1; }); }
  return map;
}
function conflicts(s){
  const bad = new Set();
  for(const t of s.tracks){
    const bl = blocksFor(s, t.id);
    for(let i=0;i<bl.length;i++) for(let j=i+1;j<bl.length;j++){
      const a = bl[i], b = bl[j];
      if(a.startMin < b.startMin + b.durMin && b.startMin < a.startMin + a.durMin){ bad.add(a.id); bad.add(b.id); }
    }
  }
  return bad;
}

function renderSessSel(){
  $("#sessSel").innerHTML = [...S.sessions].sort((a,b) => (a.date||"").localeCompare(b.date||"")).map(s => `<option value="${s.id}" ${s.id === S.current ? "selected" : ""}>${esc(s.name)}${s.date ? " – " + s.date : ""}</option>`).join("");
}
$("#sessSel").addEventListener("change", e => { S.current = e.target.value; S.view = "plan"; save(); show(); });

function render(){
  renderSessSel();
  const s = sess();
  if(!s){ $("#planHead").innerHTML = ""; $("#scroll").innerHTML = `<div class="empty">Inga pass ännu. Klicka på <b>Nytt pass</b> för att börja.</div>`; return; }
  const parts = [s.venue, s.date, s.lengthMin + " min", s.levelSplit ? "nivåindelat" : "", s.doubleCourt ? "dubbelplan" : ""].filter(Boolean);
  $("#planHead").innerHTML = `<h1>${esc(s.name)}</h1><span class="sub">${esc(parts.join(", "))}</span>
    <span class="spacer"></span><button class="btn" id="editSess">Ändra passet</button><button class="btn danger" id="delSess">Ta bort passet</button>
    <div class="hint" style="flex-basis:100%">Dra in övningar från banken. Dra i nederkanten för att förlänga. Klicka på en övning för hela förklaringen. Håll <b>Alt</b> när du släpper för att lägga övningen över alla spår.</div>`;
  $("#editSess").onclick = () => openSessDialog(s);
  $("#delSess").onclick = () => { if(confirm(`Ta bort ${s.name}?`)){ S.sessions = S.sessions.filter(x => x.id !== s.id); S.current = S.sessions[0]?.id; save(); render(); } };

  const H = s.lengthMin * PPM + 40;
  const nums = numberMap(s), bad = conflicts(s);
  const cols = `46px repeat(${s.tracks.length}, minmax(220px,1fr))`;
  let html = `<div class="grid" style="grid-template-columns:${cols}">`;
  html += `<div></div>` + s.tracks.map(t => {
    const u = usedMin(s, t.id), over = u > s.lengthMin;
    const gopts = `<option value="">Ingen grupp kopplad</option>` + S.groups.map(g => `<option value="${g.id}" ${g.id === t.groupId ? "selected" : ""}>${esc(g.name)} (${(g.playerIds||[]).length} spelare)</option>`).join("");
    return `<div class="track-h"><span class="t">${esc(t.name)}</span>${s.doubleCourt ? `<span class="court">Plan ${esc(t.court)}</span>` : ""}
      <div class="used ${over ? "over" : ""}">${u} av ${s.lengthMin} min planerade${over ? " – för långt" : ""}</div>
      ${S.groups.length ? `<select data-track="${t.id}" aria-label="Koppla träningsgrupp">${gopts}</select>` : ""}</div>`;
  }).join("");
  let ticks = "";
  for(let m = 0; m <= s.lengthMin; m += 10) ticks += `<div class="tick" style="top:${m*PPM}px">${m}</div>`;
  html += `<div class="ruler" style="height:${H}px">${ticks}</div>`;
  for(const t of s.tracks){
    html += `<div class="track" data-track="${t.id}" style="height:${H}px"><div class="lines"></div><div class="end" style="top:${s.lengthMin*PPM}px"></div>`;
    for(const b of s.blocks.filter(b => b.trackId === t.id)) html += blkHTML(b, nums, bad);
    html += `</div>`;
  }
  html += `</div>`;
  $("#scroll").innerHTML = html;
  // all-track blocks overlay
  const grid = $("#scroll .grid"), firstTrack = grid.querySelector(".track");
  if(firstTrack){
    const top = firstTrack.offsetTop, left = firstTrack.offsetLeft, width = grid.scrollWidth - left;
    for(const b of s.blocks.filter(b => b.trackId === "all")){
      const w = document.createElement("div");
      w.className = "allbar"; w.style.cssText = `top:${top}px;left:${left}px;width:${width}px;height:0`;
      w.innerHTML = blkHTML(b, nums, bad, true);
      grid.appendChild(w);
    }
  }
  grid.querySelectorAll("select[data-track]").forEach(sel => sel.onchange = () => {
    const t = s.tracks.find(x => x.id === sel.dataset.track); t.groupId = sel.value || null; save();
  });
}
function blkHTML(b, nums, bad, all){
  const e = exById(b.exerciseId) || {code:"?", name:"Okänd övning", group:"EG"};
  return `<div class="blk ${all ? "all" : ""} ${bad.has(b.id) ? "krock" : ""}" data-blk="${b.id}" tabindex="0"
    style="--c:${color(e.group)};top:${b.startMin*PPM}px;height:${b.durMin*PPM - 2}px">
    <div class="l1">Övning ${nums[b.id] || "–"}: ${b.durMin} min · ${b.startMin}–${b.startMin + b.durMin}${all ? " · alla spår" : ""}</div>
    <div class="l2"><span class="code">${esc(e.code)}</span>${esc(e.name)}</div><div class="rz" data-rz="1" aria-hidden="true"></div></div>`;
}

/* drop from bank */
$("#scroll").addEventListener("dragover", e => { const t = e.target.closest(".track"); if(t){ e.preventDefault(); t.classList.add("over"); } });
$("#scroll").addEventListener("dragleave", e => { const t = e.target.closest(".track"); if(t) t.classList.remove("over"); });
$("#scroll").addEventListener("drop", e => {
  const t = e.target.closest(".track"); if(!t) return; e.preventDefault(); t.classList.remove("over");
  const id = e.dataTransfer.getData("text/plain"); if(!id) return;
  const y = e.clientY - t.getBoundingClientRect().top;
  addBlock(id, e.altKey ? "all" : t.dataset.track, Math.max(0, Math.round(y / PPM / SNAP) * SNAP));
});
function addBlock(exId, trackId, start){
  const s = sess(), ex = exById(exId); if(!s || !ex) return;
  let dur = ex.defaultMin || 10;
  const occ = trackId === "all" ? s.blocks : blocksFor(s, trackId);
  for(let guard = 0; guard < 50; guard++){
    const hit = occ.find(b => start < b.startMin + b.durMin && b.startMin < start + dur);
    if(!hit) break; start = hit.startMin + hit.durMin;
  }
  if(start >= s.lengthMin){ toast("Passet är fullt i det spåret – förläng passet eller korta en övning."); }
  s.blocks.push({id:rid("blk"), exerciseId:exId, trackId, startMin:start, durMin:dur});
  save(); render(); toast(`${ex.code} ${ex.name} inlagd`);
}

/* move / resize / click */
let drag = null;
$("#scroll").addEventListener("pointerdown", e => {
  const el = e.target.closest(".blk"); if(!el) return;
  const s = sess(), b = s.blocks.find(x => x.id === el.dataset.blk);
  drag = {el, b, mode: e.target.dataset.rz ? "rz" : "mv", y0:e.clientY, x0:e.clientX, start:b.startMin, dur:b.durMin, moved:false};
  if(drag.mode === "rz"){
    // övningar som ligger efter i samma spår (eller i alla spår om övningen gäller alla) följer med
    const end = b.startMin + b.durMin;
    const same = x => b.trackId === "all" || x.trackId === b.trackId || x.trackId === "all";
    drag.followers = s.blocks.filter(x => x.id !== b.id && same(x) && x.startMin >= end).map(x => ({b:x, start:x.startMin, el:document.querySelector(`[data-blk="${x.id}"]`)}));
    drag.label = el.querySelector(".l1").textContent.split(":")[0];
  }
  el.setPointerCapture(e.pointerId);
});
$("#scroll").addEventListener("pointermove", e => {
  if(!drag) return;
  const dy = e.clientY - drag.y0, dx = e.clientX - drag.x0;
  if(Math.abs(dy) + Math.abs(dx) > 4) drag.moved = true;
  if(!drag.moved) return;
  const s = sess(), step = Math.round(dy / PPM / SNAP) * SNAP;
  if(drag.mode === "rz"){
    drag.b.durMin = Math.max(SNAP, Math.min(drag.dur + step, s.lengthMin - drag.b.startMin + 60));
    drag.el.style.height = drag.b.durMin * PPM - 2 + "px";
    drag.el.querySelector(".l1").textContent = `${drag.label}: ${drag.b.durMin} min · ${drag.b.startMin}–${drag.b.startMin + drag.b.durMin}`;
    const delta = drag.b.durMin - drag.dur;
    for(const f of drag.followers || []){
      f.b.startMin = Math.max(0, f.start + delta);
      if(f.el){ f.el.style.top = f.b.startMin * PPM + "px";
        const l1 = f.el.querySelector(".l1"); l1.textContent = `${l1.textContent.split(":")[0]}: ${f.b.durMin} min · ${f.b.startMin}–${f.b.startMin + f.b.durMin}`; }
    }
  } else {
    drag.b.startMin = Math.max(0, drag.start + step);
    drag.el.style.top = drag.b.startMin * PPM + "px";
    const l1 = drag.el.querySelector(".l1"); l1.textContent = `${l1.textContent.split(":")[0]}: ${drag.b.durMin} min · ${drag.b.startMin}–${drag.b.startMin + drag.b.durMin}`;
    if(drag.b.trackId !== "all"){
      drag.el.style.visibility = "hidden";
      const under = document.elementFromPoint(e.clientX, e.clientY)?.closest(".track");
      drag.el.style.visibility = "";
      if(under) drag.target = under.dataset.track;
    }
  }
});
$("#scroll").addEventListener("pointerup", e => {
  if(!drag) return;
  const d = drag; drag = null;
  if(!d.moved){ showBlock(d.b.id); return; }
  if(d.target && d.mode === "mv") d.b.trackId = d.target;
  save(); render();
});
$("#scroll").addEventListener("keydown", e => { const el = e.target.closest(".blk"); if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); showBlock(el.dataset.blk); } });

function showBlock(blkId){
  const s = sess(), b = s.blocks.find(x => x.id === blkId), e = exById(b.exerciseId) || {code:"?",name:"Okänd",group:"EG"};
  const nums = numberMap(s), d = $("#dlgEx");
  const draw = () => {
    d.innerHTML = `<div class="dlg-h" style="border-left:5px solid ${color(e.group)}"><div><div class="hint">${esc(e.code)} · ${esc((GROUPS[e.group]||GROUPS.EG).n)}${e.age ? " · " + esc(e.age) : ""}</div>
      <h3>Övning ${nums[b.id] || ""}: ${esc(e.name)}</h3>
      <div class="durctl"><button id="dm" aria-label="Fem minuter kortare">−</button><b>${b.durMin} min</b><button id="dp" aria-label="Fem minuter längre">+</button>
      <span class="hint">${b.startMin}–${b.startMin + b.durMin} min</span></div></div></div>
      <div class="dlg-b">${exBody(e)}</div>
      <div class="dlg-f"><label class="check"><input type="checkbox" id="allChk" ${b.trackId === "all" ? "checked" : ""}> Gäller alla spår</label>
      <span class="spacer"></span><button class="btn danger" id="rmBlk">Ta bort från passet</button><button class="btn primary" id="closeEx">Klar</button></div>`;
    const ripple = delta => { const end = b.startMin + b.durMin;
      s.blocks.filter(x => x.id !== b.id && (b.trackId === "all" || x.trackId === b.trackId || x.trackId === "all") && x.startMin >= end).forEach(x => x.startMin = Math.max(0, x.startMin + delta)); };
    $("#dm").onclick = () => { if(b.durMin > SNAP){ ripple(-SNAP); b.durMin -= SNAP; } save(); draw(); render(); };
    $("#dp").onclick = () => { ripple(SNAP); b.durMin += SNAP; save(); draw(); render(); };
    $("#allChk").onchange = ev => { b.trackId = ev.target.checked ? "all" : s.tracks[0].id; save(); render(); };
    $("#rmBlk").onclick = () => { s.blocks = s.blocks.filter(x => x.id !== b.id); save(); d.close(); render(); };
    $("#closeEx").onclick = () => d.close();
  };
  draw(); d.showModal();
}

    <label for="nTrains">Det tränar</label><input id="nTrains" value="${esc(v.trains)}">
    <label for="nThink">Tänk på – en punkt per rad</label><textarea id="nThink">${esc((v.think||[]).join("\n"))}</textarea>
    <div class="row"><div><label for="nEasy">Lättare</label><input id="nEasy" value="${esc(v.easier)}"></div><div><label for="nHard">Svårare</label><input id="nHard" value="${esc(v.harder)}"></div></div>
    <label for="nWatch">Ledaren tittar efter</label><input id="nWatch" value="${esc(v.watch)}">
    <label for="nGk">Målvakten</label><input id="nGk" value="${esc(v.goalkeeper)}" placeholder="Vad tränar målvakterna under övningen?">
   </div>
   <div class="dlg-f"><span class="spacer"></span><button class="btn" id="cNew">Avbryt</button><button class="btn primary" id="okNew">${e ? "Spara" : "Lägg till i banken"}</button></div>`;
  d.showModal();
  $("#cNew").onclick = () => d.close();
  $("#okNew").onclick = () => {
    const name = $("#nName").value.trim(); if(!name){ $("#nName").focus(); return; }
    const lines = id => $(id).value.split("\n").map(x => x.trim()).filter(Boolean);
    const n = e || {id:rid("ex_eg"), code:"EG" + (S.own.reduce((m,x) => Math.max(m, +x.code.slice(2) || 0), 0) + 1), group:"EG", source:"egen"};
    Object.assign(n, {name, age:$("#nAge").value.trim(), defaultMin:+$("#nMin").value || 10, steps:lines("#nSteps"), trains:$("#nTrains").value.trim(),
      think:lines("#nThink"), easier:$("#nEasy").value.trim(), harder:$("#nHard").value.trim(), watch:$("#nWatch").value.trim(), goalkeeper:$("#nGk").value.trim()});
    if(!e) S.own.push(n);
    save(); d.close(); renderBank(); render(); toast(`${n.code} ${n.name} ${e ? "sparad" : "tillagd i banken"}`);
  };
}

/* ---------- export / import ---------- */
function download(name, obj){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type:"application/json"}));
  a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#exportBtn").onclick = () => download(`practiceplanner_${new Date().toISOString().slice(0,10)}.json`,
  {schema:"handbollssviten/planner@1", app:"PracticePlanner", exportedAt:new Date().toISOString(), exercises:S.own, sessions:S.sessions, groups:S.groups});
let importMode = "all";
$("#importBtn").onclick = () => { importMode = "all"; $("#fileIn").click(); };
$("#impGroups").onclick = () => { importMode = "groups"; $("#fileIn").click(); };
$("#fileIn").onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if(!f) return;
  let d; try{ d = JSON.parse(await f.text()); }catch(e){ toast("Filen kunde inte läsas – den är inte en JSON-fil."); return; }
  const merge = (arr, items) => { for(const it of items || []){ const i = arr.findIndex(x => x.id === it.id); if(i >= 0) arr[i] = it; else arr.push(it); } };
  if(importMode === "groups" || (d.schema || "").startsWith("handbollssviten/groups")){
    const gs = (d.groups || []).map(g => ({id:g.id, name:g.name, teamId:g.teamId || null, level:g.level || "", playerIds:g.playerIds || []}));
    if(!gs.length){ toast("Inga träningsgrupper hittades i filen."); return; }
    merge(S.groups, gs); save(); render(); toast(`${gs.length} träningsgrupper importerade`); return;
  }
  merge(S.own, d.exercises); merge(S.sessions, d.sessions); merge(S.groups, d.groups);
  if(!S.current && S.sessions[0]) S.current = S.sessions[0].id;
  save(); renderBank(); render(); toast("Importen är klar");
};

/* ---------- print ---------- */
$("#printBtn").onclick = () => { buildPrint(); window.print(); };
function buildPrint(){
  const s = sess(); if(!s) return;
  const nums = numberMap(s);
  let h = `<h1>${esc(s.name)}</h1><div>${esc([s.venue, s.date, s.lengthMin + " min"].filter(Boolean).join(", "))}</div>`;
  const all = s.blocks.filter(b => b.trackId === "all").sort((a,b) => a.startMin - b.startMin);
  const part = (title, list) => {
    if(!list.length) return "";
    return `<h2>${esc(title)}</h2>` + list.map(b => { const e = exById(b.exerciseId) || {code:"?",name:"?"};
      return `<div class="pb"><b>Övning ${nums[b.id]}: ${b.durMin} min (${b.startMin}–${b.startMin + b.durMin})</b> – ${esc(e.name)} <i>${esc(e.code)}</i>
        ${e.steps?.length ? `<ol>${e.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}${e.goalkeeper ? `<div><b>Målvakten:</b> ${esc(e.goalkeeper)}</div>` : ""}</div>`; }).join("");
  };
  h += part("Alla", all);
  for(const t of s.tracks) h += part(t.name + (s.doubleCourt ? ` – plan ${t.court}` : ""), s.blocks.filter(b => b.trackId === t.id).sort((a,b) => a.startMin - b.startMin));
  $("#print").innerHTML = h;
}


/* ---------- översikt och säsong ---------- */
const WD = ["sön","mån","tis","ons","tor","fre","lör"], WDL = ["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"];
const MON = ["jan","feb","mar","apr","maj","jun","jul","aug","sep","okt","nov","dec"];
const iso = d => d.toISOString().slice(0,10);
const pd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(Date.UTC(y, m-1, d)); };
function isoWeek(d){ const t = new Date(d); const day = (t.getUTCDay() + 6) % 7; t.setUTCDate(t.getUTCDate() - day + 3); const f = new Date(Date.UTC(t.getUTCFullYear(),0,4)); return 1 + Math.round(((t - f) / 864e5 - 3 + ((f.getUTCDay() + 6) % 7)) / 7); }
function season(){ return (S.seasons || []).find(x => x.id === S.season) || (S.seasons || [])[0]; }
function occurrences(se){
  const out = [], counts = {};
  if(!se) return out;
  for(let d = pd(se.start); d <= pd(se.end); d.setUTCDate(d.getUTCDate() + 1)){
    const ds = iso(d);
    if((se.breaks || []).some(b => b.from && b.to && ds >= b.from && ds <= b.to)) continue;
    for(const day of se.days){
      if(day.weekday !== d.getUTCDay()) continue;
      counts[day.id] = (counts[day.id] || 0) + 1;
      out.push({date:ds, day, nr:counts[day.id], week:isoWeek(d), dt:new Date(d)});
    }
  }
  return out;
}
function sessFor(o){ return S.sessions.find(s => s.dayId === o.day.id && s.date === o.date); }
function openOccurrence(o){
  let s = sessFor(o);
  if(!s){
    const day = o.day, lv = day.levelSplit ? day.levels : (day.doubleCourt ? ["Plan A","Plan B"] : ["Hela gruppen"]);
    s = {id:rid("ses"), seasonId:season().id, dayId:day.id, name:`${day.venue} ${WD[day.weekday]} – nr ${o.nr}`, date:o.date,
      venue:`${day.venue} ${WD[day.weekday]}`, time:day.time, lengthMin:day.lengthMin, levelSplit:day.levelSplit, doubleCourt:day.doubleCourt,
      tracks: lv.map((n,i) => ({id:rid("trk"), name:n, court: day.doubleCourt ? "AB"[i % 2] : "A", groupId:null})), blocks:[]};
    S.sessions.push(s);
  }
  S.current = s.id; S.view = "plan"; save(); show();
}
function status(s){
  if(!s || !s.blocks.length) return {c:"#636366", t:"Inte planerad"};
  const u = Math.max(...s.tracks.map(t => usedMin(s, t.id)));
  if(u >= s.lengthMin) return {c:"var(--green)", t:`Planerad, ${u} min`};
  return {c:"var(--yellow)", t:`Påbörjad, ${u} av ${s.lengthMin} min`};
}
function renderOverview(){
  const el = $("#overView"), se = season();
  if(!se || S.editSeason){ renderSetup(se && S.editSeason ? se : null); return; }
  const occ = occurrences(se), today = iso(new Date());
  const planned = occ.filter(o => { const s = sessFor(o); return s && s.blocks.length; }).length;
  const left = occ.filter(o => o.date >= today).length;
  const opts = S.seasons.map(x => `<option value="${x.id}" ${x.id === se.id ? "selected" : ""}>${esc(x.name)}</option>`).join("");
  let html = `<div class="ohead"><h1>Säsong ${esc(se.name)}</h1><select id="seaSel" aria-label="Välj säsong">${opts}</select>
    <button class="btn" id="editSea">Ändra säsongen</button><button class="btn" id="newSea">Ny säsong</button></div>
    <p class="lead">${esc(se.days.map(d => `${WDL[d.weekday]} ${d.venue}${d.time ? " " + d.time : ""}`).join(", "))}. Klicka på en träning för att planera den.</p>
    <div class="stats"><div class="stat"><b>${occ.length}</b><span>träningar i säsongen</span></div>
    <div class="stat" style="--c:var(--green)"><b>${planned}</b><span>planerade</span></div>
    <div class="stat" style="--c:var(--yellow)"><b>${occ.length - planned}</b><span>kvar att planera</span></div>
    <div class="stat"><b>${left}</b><span>träningar kvar från idag</span></div></div>
    ${(() => { const nx = occ.filter(o => o.date >= today).slice(0, 3); if(!nx.length) return "";
      return `<div class="lbl" style="font-size:13px">Nästa träningar</div><div class="days next">` + nx.map(o => { const st = status(sessFor(o));
        return `<button class="day big" style="--st:${st.c}" data-date="${o.date}" data-day="${o.day.id}"><div class="d1">${esc(o.day.venue)} ${WD[o.day.weekday]} – nr ${o.nr}</div>
        <div class="d2">${WDL[o.dt.getUTCDay()]} ${o.dt.getUTCDate()} ${MON[o.dt.getUTCMonth()]}${o.day.time ? ", " + o.day.time : ""} · ${esc(st.t)}</div></button>`; }).join("") + `</div><div class="lbl" style="font-size:13px;margin-top:26px">Hela säsongen</div>`; })()}
    <div class="legend"><span><i style="background:var(--green)"></i>Planerad</span><span><i style="background:var(--yellow)"></i>Påbörjad</span><span><i style="background:#636366"></i>Inte planerad</span></div>`;
  const weeks = [];
  for(const o of occ){ const k = o.dt.getUTCFullYear() + "-" + o.week; let w = weeks.find(x => x.k === k); if(!w){ w = {k, week:o.week, items:[]}; weeks.push(w); } w.items.push(o); }
  const curWeek = isoWeek(pd(today));
  for(const w of weeks){
    const f = w.items[0].dt, now = w.items.some(o => isoWeek(pd(o.date)) === curWeek && o.dt.getUTCFullYear() === new Date().getFullYear());
    html += `<div class="week ${now ? "now" : ""}"><div class="wk">Vecka ${w.week}<small>${f.getUTCDate()} ${MON[f.getUTCMonth()]}</small></div><div class="days cols" style="--n:${se.days.length}">` +
      w.items.map(o => { const s = sessFor(o), st = status(s), col = Math.max(0, se.days.findIndex(d => d.id === o.day.id)) + 1;
        return `<button class="day ${o.date < today ? "past" : ""}" style="--st:${st.c};--col:${col}" data-date="${o.date}" data-day="${o.day.id}">
          <div class="d1">${esc(o.day.venue)} ${WD[o.day.weekday]} – nr ${o.nr}</div>
          <div class="d2">${WDL[o.dt.getUTCDay()]} ${o.dt.getUTCDate()} ${MON[o.dt.getUTCMonth()]}${o.day.time ? ", " + o.day.time : ""}</div>
          <div class="d3">${esc(st.t)}</div></button>`; }).join("") +
      `</div></div>`;
  }
  if(!occ.length) html += `<div class="empty">Inga träningar i perioden. Kontrollera datumen och träningsdagarna under <b>Ändra säsongen</b>.</div>`;
  el.innerHTML = html;
  $("#seaSel").onchange = e => { S.season = e.target.value; save(); renderOverview(); };
  $("#editSea").onclick = () => { S.editSeason = true; renderOverview(); };
  $("#newSea").onclick = () => { S.editSeason = "new"; renderSetup(null); };
  el.querySelectorAll(".day").forEach(b => b.onclick = () => openOccurrence(occ.find(o => o.date === b.dataset.date && o.day.id === b.dataset.day)));
}
function dayRowHTML(d){
  return `<div class="dayrow" data-id="${d.id}">
    <div><label>Veckodag</label><select class="wd">${WDL.map((n,i) => `<option value="${i}" ${i === d.weekday ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    <div><label>Plats</label><input type="text" class="vn" value="${esc(d.venue)}" placeholder="Victoria"></div>
    <div><label>Tid</label><input type="time" class="tm" value="${esc(d.time)}"></div>
    <div><label>Minuter</label><input type="number" class="ln" min="15" step="5" value="${d.lengthMin}"></div>
    <button class="btn danger rm" title="Ta bort dagen">Ta bort</button>
    <div class="opts"><label class="check"><input type="checkbox" class="lv" ${d.levelSplit ? "checked" : ""}> Nivåindelning</label>
      <input type="text" class="lvn" value="${esc((d.levels || ["Nivå 1–2","Nivå 2–3"]).join(", "))}" aria-label="Nivåer, kommaseparerade">
      <label class="check"><input type="checkbox" class="db" ${d.doubleCourt ? "checked" : ""}> Dubbelplan</label></div></div>`;
}
function renderSetup(se){
  const el = $("#overView"), y = new Date().getFullYear(), m = new Date().getMonth();
  const sy = m >= 6 ? y : y - 1;
  const v = se || {id:"ssn_" + sy + "_" + String(sy + 1).slice(2), name:`${sy}/${String(sy + 1).slice(2)}`, start:`${sy}-08-15`, end:`${sy + 1}-04-30`,
    days:[{id:rid("day"),weekday:2,venue:"Victoria",time:"17:30",lengthMin:90,levelSplit:true,levels:["Nivå 1–2","Nivå 2–3"],doubleCourt:true},
          {id:rid("day"),weekday:3,venue:"Tuna",time:"17:30",lengthMin:90,levelSplit:false,levels:["Nivå 1–2","Nivå 2–3"],doubleCourt:false},
          {id:rid("day"),weekday:6,venue:"Hedda",time:"11:00",lengthMin:90,levelSplit:false,levels:["Nivå 1–2","Nivå 2–3"],doubleCourt:false}],
    breaks:[{from:`${sy}-12-21`,to:`${sy + 1}-01-06`,name:"Jul och nyår"}]};
  const first = !(S.seasons || []).length;
  el.innerHTML = `<div class="setup"><h1>${se ? "Ändra säsongen" : first ? "Välkommen – starta en säsong" : "Ny säsong"}</h1>
    <p class="lead">Välj period och skriv in vilka dagar ni tränar. PracticePlanner lägger ut alla träningar i säsongen, så att ni kan planera dem en i taget.</p>
    <div class="form"><div class="row"><div><label for="sName">Säsong</label><input id="sName" value="${esc(v.name)}"></div>
      <div><label for="sStart">Första träning</label><input id="sStart" type="date" value="${v.start}"></div>
      <div><label for="sEnd">Sista träning</label><input id="sEnd" type="date" value="${v.end}"></div></div>
    <div class="lbl" style="margin-top:20px">Träningsdagar</div><div id="dayRows">${v.days.map(dayRowHTML).join("")}</div>
    <button class="btn" id="addDay" style="margin-top:8px">Lägg till en träningsdag</button>
    <div class="lbl" style="margin-top:20px">Uppehåll</div><div id="brkRows">${(v.breaks || []).map(b => brkHTML(b)).join("")}</div>
    <button class="btn" id="addBrk" style="margin-top:8px">Lägg till uppehåll</button></div>
    <div style="display:flex;gap:8px;margin-top:24px">${first ? "" : `<button class="btn" id="cancelSea">Avbryt</button>`}<button class="btn primary" id="saveSea">${se ? "Spara säsongen" : "Starta säsongen"}</button></div></div>`;
  $("#addDay").onclick = () => $("#dayRows").insertAdjacentHTML("beforeend", dayRowHTML({id:rid("day"),weekday:1,venue:"",time:"",lengthMin:90,levelSplit:false,levels:["Nivå 1–2","Nivå 2–3"],doubleCourt:false}));
  $("#addBrk").onclick = () => $("#brkRows").insertAdjacentHTML("beforeend", brkHTML({from:"",to:"",name:""}));
  el.onclick = e => { if(e.target.classList.contains("rm")) e.target.closest(".dayrow,.brk").remove(); };
  if($("#cancelSea")) $("#cancelSea").onclick = () => { S.editSeason = false; renderOverview(); };
  $("#saveSea").onclick = () => {
    const days = [...document.querySelectorAll(".dayrow")].map(r => ({id:r.dataset.id, weekday:+r.querySelector(".wd").value, venue:r.querySelector(".vn").value.trim() || "Träning",
      time:r.querySelector(".tm").value, lengthMin:Math.max(15, +r.querySelector(".ln").value || 90), levelSplit:r.querySelector(".lv").checked,
      levels:r.querySelector(".lvn").value.split(",").map(x => x.trim()).filter(Boolean), doubleCourt:r.querySelector(".db").checked}));
    if(!days.length){ toast("Lägg till minst en träningsdag."); return; }
    const breaks = [...document.querySelectorAll(".brk")].map(r => ({from:r.querySelector(".bf").value, to:r.querySelector(".bt").value, name:r.querySelector(".bn").value.trim()})).filter(b => b.from && b.to);
    const obj = se || {id:v.id};
    Object.assign(obj, {name:$("#sName").value.trim() || v.name, start:$("#sStart").value, end:$("#sEnd").value, days, breaks});
    if(!obj.start || !obj.end || obj.end < obj.start){ toast("Kontrollera datumen – sista träningen måste komma efter den första."); return; }
    S.seasons = S.seasons || [];
    if(!se){ if(S.seasons.some(x => x.id === obj.id)) obj.id = obj.id + "_" + rid("").slice(1,5); S.seasons.push(obj); }
    S.season = obj.id; S.editSeason = false; save(); renderOverview(); $("#overView").scrollTop = 0; toast(se ? "Säsongen är sparad" : "Säsongen är startad");
  };
}
function brkHTML(b){
  return `<div class="brk"><div><label>Från</label><input type="date" class="bf" value="${b.from}"></div><div><label>Till</label><input type="date" class="bt" value="${b.to}"></div>
    <div><label>Vad</label><input type="text" class="bn" value="${esc(b.name || "")}" placeholder="Till exempel sportlov"></div><button class="btn danger rm">Ta bort</button></div>`;
}
function show(){
  const over = (S.view || "over") === "over";
  $("#overView").hidden = !over; $("#planView").hidden = over;
  $("#goOver").setAttribute("aria-current", over ? "page" : "false"); $("#goPlan").setAttribute("aria-current", over ? "false" : "page");
  renderSessSel();
  if(over){ renderOverview(); $("#overView").scrollTop = 0; } else { renderBank(); render(); }
}
$("#goOver").onclick = () => { S.view = "over"; save(); show(); };
$("#goPlan").onclick = () => { S.view = "plan"; save(); show(); };
$("#themeBtn").onclick = () => { S.theme = S.theme === "light" ? "dark" : "light"; save(); applyTheme(); };
applyTheme();
$("#appVersion").textContent = "v" + APP_VERSION;

renderChips(); show();
</script>
